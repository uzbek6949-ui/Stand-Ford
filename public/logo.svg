<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Stanford School badge — faithful vector recreation of the brand logo -->
  <circle cx="100" cy="100" r="100" fill="#cf2e2e"/>

  <defs>
    <path id="arcTop" d="M 20 100 A 80 80 0 0 1 180 100"/>
    <path id="arcBottom" d="M 32 100 A 68 68 0 0 0 168 100"/>
  </defs>

  <!-- top arc text -->
  <text fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="2.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">STANFORD SCHOOL</textPath>
  </text>

  <!-- bottom arc text -->
  <text fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-style="italic" letter-spacing="1.6">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">WIDEN YOUR HORIZONS</textPath>
  </text>

  <!-- shield -->
  <path d="M70 62 L130 62 L130 97 Q130 122 100 139 Q70 122 70 97 Z"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>

  <!-- mortarboard: diamond top -->
  <path d="M100 76 L127 89 L100 102 L73 89 Z" fill="#ffffff"/>
  <!-- cap base -->
  <path d="M88 99 L112 99 L110 112 Q100 118 90 112 Z" fill="#ffffff"/>
  <!-- tassel -->
  <path d="M73 89 L73 106" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="73" cy="109" r="3" fill="#ffffff"/>

  <!-- laurel — left branch -->
  <g fill="#ffffff">
    <path d="M46 148 Q60 152 74 148 Q60 158 46 148 Z"/>
    <ellipse cx="47" cy="138" rx="8" ry="3.1" transform="rotate(-38 47 138)"/>
    <ellipse cx="42" cy="127" rx="8" ry="3.1" transform="rotate(-58 42 127)"/>
    <ellipse cx="39" cy="115" rx="8" ry="3.1" transform="rotate(-74 39 115)"/>
    <ellipse cx="38" cy="103" rx="8" ry="3.1" transform="rotate(-88 38 103)"/>
    <ellipse cx="55" cy="141" rx="7.4" ry="3" transform="rotate(-16 55 141)"/>
    <ellipse cx="50" cy="131" rx="7.4" ry="3" transform="rotate(-40 50 131)"/>
    <ellipse cx="46" cy="120" rx="7.4" ry="3" transform="rotate(-60 46 120)"/>
  </g>
  <!-- laurel — right branch (mirror) -->
  <g fill="#ffffff">
    <path d="M154 148 Q140 152 126 148 Q140 158 154 148 Z"/>
    <ellipse cx="153" cy="138" rx="8" ry="3.1" transform="rotate(38 153 138)"/>
    <ellipse cx="158" cy="127" rx="8" ry="3.1" transform="rotate(58 158 127)"/>
    <ellipse cx="161" cy="115" rx="8" ry="3.1" transform="rotate(74 161 115)"/>
    <ellipse cx="162" cy="103" rx="8" ry="3.1" transform="rotate(88 162 103)"/>
    <ellipse cx="145" cy="141" rx="7.4" ry="3" transform="rotate(16 145 141)"/>
    <ellipse cx="150" cy="131" rx="7.4" ry="3" transform="rotate(40 150 131)"/>
    <ellipse cx="154" cy="120" rx="7.4" ry="3" transform="rotate(60 154 120)"/>
  </g>
</svg>
